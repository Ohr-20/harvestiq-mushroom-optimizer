[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroom-harvest-optimizer"
version = "1.0.0"
description = "Yield forecasting and contamination-risk decision support for specialty mushroom farms."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

